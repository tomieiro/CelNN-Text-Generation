[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celllm"
version = "0.1.0"
description = "Small Hebbian Chua-Yang CellLM chat experiment"
requires-python = ">=3.10"
dependencies = ["celnn>=0.1", "torch>=2.1", "numpy>=1.24", "tokenizers>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["src"]
